defaults:
  - _self_

model:

  name: diffusion

  hr_mean_conditioning: true

  model_args:

    img_resolution: [32, 32]

    # Deve ser igual ao treinamento da regressão
    N_grid_channels: 0

    # Mantido para compatibilidade com CorrDiff
    gridtype: sinusoidal

    model_channels: 64

    channel_mult: [1, 2, 2, 4]

    attn_resolutions: [16]

    num_blocks: 2

    dropout: 0.10

    embedding_type: positional

    channel_mult_noise: 2

    encoder_type: standard
    decoder_type: standard

    resample_filter: [1, 1]

dataset:
  type: /home/vsantos/rionowcast/repositories/physicsnemo/examples/weather/corrdiff/datasets/zarr_dataset.py::ZarrCorrDiffDataset

  path: /home/vsantos/rionowcast/datasets/corrdiff/train.zarr

  normalization_path: /home/vsantos/rionowcast/datasets/corrdiff/normalization.npz

  train_indices: /home/vsantos/rionowcast/datasets/corrdiff/train_index.npy

  valid_indices: /home/vsantos/rionowcast/datasets/corrdiff/valid_index.npy

validation:

  type: /home/vsantos/rionowcast/repositories/physicsnemo/examples/weather/corrdiff/datasets/zarr_dataset.py::ZarrCorrDiffDataset

  path: /home/vsantos/rionowcast/datasets/corrdiff/train.zarr

  normalization_path: /home/vsantos/rionowcast/datasets/corrdiff/normalization.npz

  valid_indices: /home/vsantos/rionowcast/datasets/corrdiff/valid_index.npy

  mode: validation

training:

  hp:

    total_batch_size: 8

    batch_size_per_gpu: 1

    lr: 1e-4

    training_duration: 100000

    lr_rampup: 100

    lr_decay: 0.999

    lr_decay_rate: 500

    grad_clip_threshold: 1.0


  perf:

    fp_optimizations: none

    dataloader_workers: 2

    torch_compile: false

    songunet_checkpoint_level: 0

    cudnn_benchmark: false

    find_unused_parameters: false

    persistent_workers: true

    pin_memory: true

    prefetch_factor: 4

    use_apex_gn: false

    profile_mode: false

  io:

    regression_checkpoint_path: checkpoints/regression/checkpoints_regression/CorrDiffRegressionUNet.0.100000.mdlus

    checkpoint_dir: checkpoints/diffusion/checkpoints_diffusion

    save_checkpoint_freq: 1250

    validation_freq: 50

    validation_steps: 10

    print_progress_freq: 10

    save_n_recent_checkpoints: 5


wandb:

mode: offline

watch_model: false

results_dir: outputs
